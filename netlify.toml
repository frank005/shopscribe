[build]
  publish = "build"
  command = "npm install --prefer-offline --no-audit --no-fund && npm run build"
  base = "."

[build.environment]
  NODE_VERSION = "18"
  CI = "false"
  NODE_ENV = "production"
  NPM_CONFIG_PRODUCTION = "false"
  NPM_CONFIG_AUDIT = "false"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = []
  included_files = ["netlify/functions/utils/**"]

[dev]
  command = "npm start"
  port = 8888
  targetPort = 3000
