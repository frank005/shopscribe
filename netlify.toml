[build]
  publish = "build"
  command = "npm ci && npm run build"
  base = "."

[build.environment]
  NODE_VERSION = "18"
  CI = "false"
  NODE_ENV = "production"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"

[dev]
  command = "npm start"
  port = 8888
  targetPort = 3000
